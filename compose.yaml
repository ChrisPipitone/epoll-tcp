name: epoll-tcp
services:
  server:
    image: epoll-tcp:dev
    build:
      context: .
      target: dev
    volumes:
      - .:/app
    command: /app/build/server
    ports:
      - "8080:8080"
  client:
    image: epoll-tcp:dev
    build:
      context: .
      target: dev
    volumes:
      - .:/app
    command: /app/build/client
    profiles:
      - test
